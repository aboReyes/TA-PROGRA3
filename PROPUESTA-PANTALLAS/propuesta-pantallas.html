<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Propuesta de pantallas · Patitas Arriba</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<style>

/* Mismos colores y estilos que la aplicación (app.css, paleta C) */
:root{--verde:#3F6B52;--verde-o:#325642;--salvia:#E3ECDD;--salvia-o:#D3E0CB;--mostaza:#F2B33D;--mostaza-o:#E0A22B;--terracota:#B5483A;--terracota-o:#983B2F;--texto:#1F2A24;--crema:#FAF6EF;--linea:#ece3d2;--suave:#6b7a70}
*{box-sizing:border-box}
body{margin:0;background:var(--crema);color:var(--texto);font-family:Nunito,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.45}
h1,h2,h3,h4,h5{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--verde);font-weight:700}
.container{max-width:1320px;margin:0 auto;padding:1.5rem 1rem 4rem}
svg{flex:none}

/* Barra superior */
.barra{background:linear-gradient(90deg,#325642 0%,#3F6B52 60%,#4a7a5e 100%);box-shadow:0 6px 18px rgba(31,42,36,.18);padding:.55rem 1rem;position:sticky;top:0;z-index:30}
.barra-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:.3rem;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:.55rem;font-weight:800;color:#fff;margin-right:.8rem;font-size:1.1rem}
.logo{width:34px;height:34px;border-radius:10px;background:var(--mostaza);color:var(--verde-o);display:grid;place-items:center}
.nl{position:relative}
.nl>button{display:flex;align-items:center;gap:.4rem;background:none;border:0;color:rgba(255,255,255,.88);font-weight:700;border-radius:.7rem;padding:.45rem .7rem}
.nl>button:hover,.nl.abierto>button,.nl.activo>button{color:#fff;background:rgba(255,255,255,.14)}
.menu{position:absolute;top:calc(100% + 6px);left:0;background:#fff;border-radius:.9rem;padding:.4rem;box-shadow:0 14px 34px rgba(31,42,36,.16);min-width:15rem;display:none}
.nl.abierto .menu{display:block}
.menu button{display:flex;align-items:center;gap:.55rem;width:100%;text-align:left;background:none;border:0;border-radius:.6rem;padding:.45rem .7rem;font-weight:600}
.menu button:hover{background:var(--salvia)}
.menu button.on{background:var(--verde);color:#fff}
.menu button.off{opacity:.5;cursor:not-allowed}
.menu svg{color:var(--verde);width:16px;height:16px}.menu button.on svg{color:#fff}
.usuario{margin-left:auto;display:flex;align-items:center;gap:.55rem;color:#fff}
.avatar-b{width:34px;height:34px;border-radius:50%;background:var(--salvia);color:var(--verde-o);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.usuario small{display:block;opacity:.75;font-size:.75rem;line-height:1}
.notas-btn{background:var(--mostaza);color:var(--texto);border:0;border-radius:.6rem;padding:.4rem .8rem;font-weight:800;margin-left:.6rem}

/* Aviso de prototipo */
.aviso{background:#fff7e0;border:1px solid #ecd48a;border-radius:.9rem;padding:.55rem .9rem;font-size:.9rem;display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;justify-content:space-between;margin-bottom:1.2rem}
.aviso select{border:1px solid #ddd5c6;border-radius:.6rem;padding:.2rem .5rem;background:#fff}

/* Botones (paleta C) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:1px solid transparent;border-radius:.6rem;padding:.375rem .85rem;font-weight:600;white-space:nowrap;text-decoration:none;line-height:1.5}
.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--texto);outline-offset:2px}
.btn-p{background:var(--verde);border-color:var(--verde);color:#fff;box-shadow:0 3px 10px rgba(31,42,36,.10)}.btn-p:hover{background:var(--verde-o)}
.btn-y{background:var(--mostaza);border-color:var(--mostaza);color:var(--texto);box-shadow:0 3px 10px rgba(31,42,36,.10)}.btn-y:hover{background:var(--mostaza-o);color:#fff}
.btn-s{background:var(--salvia);border-color:#c6d6bb;color:var(--verde-o)}.btn-s:hover{background:var(--salvia-o)}
.btn-o{background:transparent;border-color:var(--verde);color:var(--verde)}.btn-o:hover{background:var(--verde);color:#fff}
.btn-d{background:transparent;border-color:var(--terracota);color:var(--terracota)}.btn-d:hover:not(:disabled){background:var(--terracota);color:#fff}
.btn-ds{background:var(--terracota);border-color:var(--terracota);color:#fff}.btn-ds:hover{background:var(--terracota-o)}
.btn-i{width:2rem;height:2rem;padding:0}
.btn-i svg{width:16px;height:16px}
.btn-bloq{width:2rem;height:2rem;padding:0;border:1px dashed #c5c0b5;color:#9c988e;background:transparent;border-radius:.6rem;cursor:not-allowed;opacity:.7;display:inline-flex;align-items:center;justify-content:center}
.btn-bloq svg{width:16px;height:16px}

/* Encabezado de pantalla */
.cab{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.cab h3{font-size:1.75rem;font-weight:800;letter-spacing:-.01em}
.cab p{margin:.2rem 0 0;color:var(--suave)}

/* Tarjetas de resumen */
.indicadores{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem;margin-bottom:1.2rem}
.indicador{background:#fff;border:1px solid var(--linea);border-radius:1.1rem;padding:1rem 1.2rem;box-shadow:0 6px 18px rgba(31,42,36,.06);display:flex;flex-direction:column;gap:.15rem}
.indicador .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;margin-bottom:.4rem}
.indicador .ico svg{width:20px;height:20px}
.ind-verde .ico{background:#e3ecdd;color:var(--verde)}.ind-mostaza .ico{background:#fdf0d2;color:#a8741a}.ind-terracota .ico{background:#f6e4e0;color:var(--terracota-o)}.ind-salvia .ico{background:#eef4ea;color:var(--verde-o)}
.indicador b{font-size:1.5rem;line-height:1.15;font-weight:800}
.indicador span.t{color:var(--suave);font-weight:600;font-size:.9rem}

/* Barra de filtros */
.filtros{background:#fff;border:1px solid var(--linea);border-radius:1rem;padding:.6rem .7rem;box-shadow:0 4px 14px rgba(31,42,36,.04);display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin-bottom:1rem}
.filtros label{font-weight:700;color:#3d4a42;white-space:nowrap}
.filtros input[type=search]{flex:1 1 220px;border:1px solid #ddd5c6;border-radius:.7rem;padding:.4rem .75rem;background:#fff}
.filtros input:focus{border-color:var(--verde);box-shadow:0 0 0 .25rem rgba(63,107,82,.22);outline:0}
.seg{display:inline-flex;border:1px solid #ddd5c6;border-radius:.7rem;overflow:hidden;margin-left:auto}
.seg button{border:0;background:#fff;padding:.35rem .8rem;font-weight:700;display:inline-flex;align-items:center;gap:.35rem}
.seg button.on{background:var(--verde);color:#fff}
.seg svg{width:16px;height:16px}

/* Tarjetas de personal */
.grilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:1rem}
.card{background:#fff;border:1px solid #e6dfd1;border-radius:1rem;box-shadow:0 6px 18px rgba(31,42,36,.06)}
.persona{display:flex;flex-direction:column;gap:.7rem;padding:1.1rem 1.2rem;border-top:4px solid var(--verde)}
.persona.yo{border-top-color:var(--mostaza)}
.enc{display:flex;gap:.8rem;align-items:center}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--salvia);color:var(--verde-o);border:3px solid var(--salvia-o);display:grid;place-items:center;font-weight:800;font-size:1.3rem;flex:none}
.persona h5{font-size:1.1rem;font-weight:800;line-height:1.2}
.etq{display:inline-flex;align-items:center;gap:.3rem;border-radius:99px;padding:.12rem .65rem;font-size:.75rem;font-weight:700;border:1px solid transparent;white-space:nowrap}
.etq svg{width:12px;height:12px}
.e-verde{background:var(--salvia);color:var(--verde);border-color:#bcd0b0}
.e-solido{background:var(--verde);color:#fff}
.e-mostaza{background:#fdf0d2;color:#7a5410;border-color:#f0d9a0}
.e-rojo{background:#f6e4e0;color:var(--terracota-o);border-color:#e3b9b1}
.e-gris{background:#ece9e1;color:#4a4a44}
.datos{display:grid;gap:.25rem;font-size:.9rem}
.datos div{display:flex;align-items:center;gap:.5rem;color:#3d4a42}
.datos svg{width:15px;height:15px;color:var(--verde)}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{background:#f4efe6;border-radius:.6rem;padding:.15rem .55rem;font-size:.8rem;font-weight:700}
.barra-prog{height:8px;border-radius:99px;background:#ece3d2;overflow:hidden}
.barra-prog i{display:block;height:100%;border-radius:99px;background:var(--verde)}
.prog-t{display:flex;justify-content:space-between;font-size:.82rem;font-weight:700;color:#3d4a42;margin-bottom:.25rem}
.pie{display:flex;justify-content:space-between;align-items:center;gap:.5rem;border-top:1px dashed var(--linea);padding-top:.7rem;margin-top:auto}
.pie .acc{display:flex;gap:.35rem}

/* Tablas */
.tabla-wrap{background:#fff;border:1px solid var(--linea);border-radius:1rem;overflow:auto;box-shadow:0 6px 18px rgba(31,42,36,.06)}
table{width:100%;border-collapse:separate;border-spacing:0}
th{background:#f4efe6;color:#3d4a42;font-weight:800;font-size:.9rem;text-align:left;padding:.75rem .8rem;border-bottom:1px solid #e6dfd1;white-space:nowrap}
td{padding:.6rem .8rem;border-bottom:1px solid #f0eadf;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:nth-child(odd) td{background:rgba(227,236,221,.35)}
.acc-celda{display:flex;gap:.35rem}
.nota{color:var(--suave);font-size:.9rem;display:flex;gap:.4rem;align-items:center;margin:.7rem .2rem}
.nota svg{width:16px;height:16px;flex:none}
.pers{display:inline-flex;align-items:center;gap:.35rem;border-radius:.6rem;padding:.15rem .6rem;font-size:.82rem;font-weight:700;margin:.1rem .2rem .1rem 0}
.pers svg{width:13px;height:13px}
.p-vet{background:#e3ecdd;color:var(--verde-o)}.p-adm{background:#f1ece0;color:#5b5646}

/* Cuadrante semanal */
.cuad{background:#fff;border:1px solid var(--linea);border-radius:1rem;box-shadow:0 6px 18px rgba(31,42,36,.06);overflow-x:auto}
.cuad-grid{display:grid;grid-template-columns:56px repeat(7,minmax(150px,1fr));min-width:1100px}
.cuad-cab{padding:.6rem .7rem;font-weight:800;background:#faf4e8;border-bottom:1px solid var(--linea);border-left:1px solid var(--linea)}
.cuad-cab small{display:block;color:var(--suave);font-weight:600}
.cuad-cab.hoy{background:#fdf0d2}
.cuad-horas{position:relative}
.cuad-hora{position:absolute;right:.45rem;font-size:.75rem;font-weight:700;color:var(--suave);transform:translateY(-50%)}
.cuad-col{position:relative;border-left:1px solid var(--linea);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--h) - 1px),#f0eadf calc(var(--h) - 1px),#f0eadf var(--h))}
.cuad-col.cerrado{background-color:#faf8f3}
.cuad-vacio{position:absolute;left:0;right:0;top:50%;text-align:center;color:#b5b0a4;font-weight:700;font-size:.85rem;transform:translateY(-50%)}
.bloque{position:absolute;left:5px;right:5px;border-radius:.8rem;padding:.4rem .55rem;text-align:left;border:1px solid transparent;overflow:hidden;font-size:.8rem;line-height:1.25;box-shadow:0 2px 6px rgba(31,42,36,.12)}
.bloque b{display:block;font-size:.88rem}
.bl-ok{background:var(--salvia);border-color:#bcd0b0;color:#24402f}
.bl-adm{background:#f1ece0;border-color:#ddd5c6;color:#5b5646}
.bl-falta{background:#fdf0d2;border:2px dashed #c9922e;color:#7a5410}
.bloque .pp{display:flex;align-items:center;gap:.25rem;margin-top:.1rem}
.bloque .pp svg{width:12px;height:12px}
.leyenda{display:flex;flex-wrap:wrap;gap:1.2rem;font-weight:700;font-size:.88rem;margin:.8rem .2rem}
.leyenda i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:.35rem}

/* Notas de diseño */
.est-ad{background:var(--verde);color:#fff}.est-adapt{background:var(--mostaza);color:var(--texto)}.est-desc{background:#ece9e1;color:#4a4a44}
.resumen-req{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem;margin-bottom:1.2rem}
.resumen-req .card{padding:1rem 1.2rem}
.resumen-req h5{font-weight:800;margin-bottom:.4rem}
.resumen-req ul{margin:0;padding-left:1.1rem}

/* Ventanas y avisos */
.ov{position:fixed;inset:0;background:rgba(10,20,14,.5);display:grid;place-items:center;padding:1rem;z-index:60}
.md{background:#fff;border-radius:1rem;padding:1.3rem 1.4rem;max-width:480px;width:100%;display:flex;flex-direction:column;gap:.9rem;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.md h4{font-size:1.2rem;font-weight:800}
.md p{margin:0;color:#4a574f}
.md .f{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}
.campo label{display:block;font-weight:700;margin-bottom:.25rem}
.campo input,.campo select{width:100%;border:1px solid #ddd5c6;border-radius:.7rem;padding:.4rem .7rem;background:#fff}
.campo input.invalido,.campo select.invalido{border-color:var(--terracota);background:#fdf3f1}
.campo:has(.invalido) label{color:var(--terracota-o)}
.campo .err{color:var(--terracota-o);font-size:.875rem;margin-top:.2rem}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:80}
.toast{background:var(--verde-o);color:#fff;padding:.6rem 1.1rem;border-radius:.8rem;font-weight:700;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
@media print{.barra,.aviso,.cab .btn,.filtros,.acc-celda,.pie .acc,#toast{display:none!important}.container{padding:0}}


/* ================= Estandarización de botones (propuesta) ================= */
.btn{height:38px;padding:0 1rem;font-size:.9rem;font-weight:700;line-height:1;border-radius:.65rem;gap:.45rem}
.btn svg{width:16px;height:16px}
.btn-sm{height:32px;padding:0 .75rem;font-size:.82rem;gap:.35rem}
.btn-lg{height:46px;padding:0 1.3rem;font-size:1rem}
.btn-i{width:32px;height:32px;padding:0}
.btn-i.md{width:38px;height:38px}
.nl>button{height:38px;font-size:.9rem;font-weight:700}
.nl>button svg{width:16px;height:16px}

/* ================= Navegación del prototipo ================= */
.pestanas{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 1rem}
.pestanas button{border:1px solid #ddd5c6;background:#fff;border-radius:99px;padding:.3rem .85rem;font-weight:700;font-size:.85rem}
.pestanas button.on{background:var(--verde);border-color:var(--verde);color:#fff}
.pestanas button .n{opacity:.6;margin-right:.25rem}
.cambia{background:#fff;border:1px solid var(--linea);border-radius:1rem;padding:.7rem 1rem;margin-bottom:1.1rem;box-shadow:0 4px 14px rgba(31,42,36,.04)}
.cambia summary{font-weight:800;cursor:pointer}
.cambia .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem;margin-top:.6rem}
.cambia h6{margin:0 0 .25rem;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:var(--suave)}
.cambia ul{margin:0;padding-left:1.1rem;font-size:.92rem}
.cambia li{margin:.15rem 0}
.tag-back{display:inline-block;border-radius:99px;padding:.05rem .55rem;font-size:.72rem;font-weight:800;margin-left:.35rem;vertical-align:1px}
.tb-front{background:var(--salvia);color:var(--verde-o)}.tb-back{background:#fdf0d2;color:#7a5410}.tb-jp{background:#f6e4e0;color:var(--terracota-o)}

/* ================= Componentes nuevos ================= */
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none;overflow:hidden;border:3px solid rgba(255,255,255,.7);box-shadow:0 0 0 1px rgba(31,42,36,.08)}
.av img{width:100%;height:100%;object-fit:cover;object-position:center 30%}
.av.lg{width:68px;height:68px;font-size:1.4rem}.av.sm{width:30px;height:30px;font-size:.72rem;border-width:2px}
.c0{background:#e3ecdd;color:#325642}.c1{background:#fdf0d2;color:#7a5410}.c2{background:#f6e4e0;color:#983B2F}.c3{background:#e4e9ef;color:#3a4a5e}.c4{background:#efe6f0;color:#5d3f63}
.tarjeta{background:#fff;border:1px solid #e6dfd1;border-radius:1rem;box-shadow:0 6px 18px rgba(31,42,36,.06);padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.65rem;position:relative;transition:box-shadow .15s,transform .15s}
.tarjeta.click{cursor:pointer}.tarjeta.click:hover{box-shadow:0 10px 26px rgba(31,42,36,.12);transform:translateY(-2px)}
.tarjeta.sel{outline:2px solid var(--verde)}
.t-enc{display:flex;gap:.75rem;align-items:center}
.t-enc h5{font-size:1.05rem;font-weight:800;line-height:1.2}
.t-enc small{color:var(--suave);font-weight:600}
.fila-chips{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.etq{height:24px;line-height:1}
.t-pie{display:flex;justify-content:space-between;align-items:center;gap:.5rem;border-top:1px dashed var(--linea);padding-top:.65rem;margin-top:auto}
.t-pie .acc{display:flex;gap:.35rem;align-items:center}
.mini-mascota{display:inline-flex;align-items:center;gap:.35rem;background:#f4efe6;border-radius:99px;padding:.1rem .6rem .1rem .1rem;font-size:.8rem;font-weight:700}
.panel-lado{background:#fff;border:1px solid #e6dfd1;border-radius:1rem;box-shadow:0 6px 18px rgba(31,42,36,.06);padding:1.1rem 1.2rem;display:flex;flex-direction:column;gap:.8rem;position:sticky;top:78px}
.dos-col{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:1rem;align-items:start}
@media(max-width:980px){.dos-col{grid-template-columns:1fr}.panel-lado{position:static}}
.chips-f{display:flex;flex-wrap:wrap;gap:.4rem}
.chips-f button{border:1px solid #ddd5c6;background:#fff;border-radius:99px;padding:.28rem .8rem;font-weight:700;font-size:.85rem;display:inline-flex;gap:.35rem;align-items:center}
.chips-f button.on{background:var(--verde);border-color:var(--verde);color:#fff}
.chips-f button .c{opacity:.65;font-weight:600}
.precio{font-size:1.4rem;font-weight:800;color:var(--verde-o)}
.ico-circ{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}
.ico-circ svg{width:22px;height:22px}
.k-med{background:#e3ecdd;color:#325642}.k-vac{background:#e4e9ef;color:#3a4a5e}.k-ali{background:#fdf0d2;color:#7a5410}.k-acc{background:#efe6f0;color:#5d3f63}.k-hig{background:#dff0f0;color:#215a5a}.k-eme{background:#f6e4e0;color:#983B2F}.k-ope{background:#e9e4f2;color:#43366b}.k-est{background:#fbe6ee;color:#8a3358}
.desc{color:#4a574f;font-size:.92rem}
.mut{color:var(--suave)}
.fila-lista{display:flex;align-items:center;gap:.85rem;padding:.7rem 1rem;border-bottom:1px solid #f0eadf;background:#fff}
.fila-lista:last-child{border-bottom:0}
.lista-wrap{background:#fff;border:1px solid var(--linea);border-radius:1rem;overflow:hidden;box-shadow:0 6px 18px rgba(31,42,36,.06)}
.fila-lista .grow{flex:1;min-width:0}
.fila-lista .grow b{display:block}
.letra{background:#faf4e8;color:var(--verde-o);font-weight:800;padding:.35rem 1rem;border-bottom:1px solid var(--linea);font-size:.85rem;letter-spacing:.06em}
.stepper{display:inline-flex;align-items:center;background:#f4efe6;border-radius:.7rem;overflow:hidden}
.stepper button{border:0;background:transparent;width:30px;height:32px;font-weight:800}
.stepper button:hover{background:var(--salvia-o)}
.stepper span{min-width:36px;text-align:center;font-weight:800;background:#fff;height:32px;line-height:32px}
.nombre-art small{display:block;color:var(--suave);font-weight:600;font-size:.82rem;max-width:34ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-v{background:linear-gradient(120deg,#325642,#3F6B52);color:#fff;border-radius:1.2rem;padding:1.2rem 1.4rem;display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem}
.hero-v h3{font-weight:800;font-size:1.5rem}
.hero-v .indicador{color:var(--texto)}
.hero-v .btns{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.7rem}
.btn-glass{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28);color:#fff}.btn-glass:hover{background:rgba(255,255,255,.26)}
.linea-t{position:relative;display:flex;flex-direction:column;gap:.9rem}
.linea-t::before{content:"";position:absolute;left:10px;top:14px;bottom:14px;width:3px;margin-left:-1.5px;background:var(--salvia-o);border-radius:2px}
.linea-t .it{display:grid;grid-template-columns:20px minmax(0,1fr);column-gap:.9rem;align-items:center}
.linea-t .it::before{content:"";box-sizing:border-box;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--verde);justify-self:center;position:relative;z-index:1}
.linea-t .it.pend::before{border-color:var(--mostaza)}
.linea-t .it.eme::before{border-color:var(--terracota)}
.linea-t .it.top::before{align-self:start;margin-top:21px}
.fila-cuenta{display:grid;grid-template-columns:48px minmax(160px,1.1fr) minmax(170px,1fr) 130px auto;align-items:center;gap:.9rem;padding:.7rem 1rem;border-bottom:1px solid #f0eadf;background:#fff}
.fila-cuenta:last-child{border-bottom:0}
.fila-cuenta .grow b{display:block}
.fila-cuenta.cab-c{background:#faf4e8;padding:.5rem 1rem;font-size:.78rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--suave)}
@media(max-width:760px){.fila-cuenta{grid-template-columns:48px 1fr auto}.fila-cuenta>:nth-child(3),.fila-cuenta>:nth-child(4){grid-column:2}.fila-cuenta.cab-c{display:none}}
.pasos{display:flex;gap:.3rem;align-items:center;flex-wrap:wrap;font-size:.78rem;font-weight:700}
.pasos span{display:inline-flex;align-items:center;gap:.25rem;border-radius:99px;padding:.1rem .55rem;background:#ece9e1;color:#6b6b60}
.pasos span.ok{background:var(--salvia);color:var(--verde-o)}
.pasos span.act{background:var(--mostaza);color:var(--texto)}
.pasos svg{width:11px;height:11px}
.receta{background:#fffdf7;border:1px solid #e6dfd1;border-left:5px solid var(--verde);border-radius:.9rem;padding:1rem 1.1rem;box-shadow:0 6px 18px rgba(31,42,36,.06);display:flex;flex-direction:column;gap:.55rem}
.med{display:flex;justify-content:space-between;gap:.6rem;font-size:.9rem;border-bottom:1px dotted #e0d8c6;padding:.25rem 0}
.sw{display:inline-flex;align-items:center;gap:.5rem;font-weight:700}
.sw i{width:42px;height:24px;border-radius:99px;background:#d9d3c6;position:relative;transition:.15s;display:inline-block}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.sw.on i{background:var(--terracota)}.sw.on i::after{left:21px}
.form-card{background:#fff;border:1px solid #e6dfd1;border-radius:1rem;padding:1.1rem 1.2rem;box-shadow:0 6px 18px rgba(31,42,36,.06)}
.form-card.eme{border-color:#e3b9b1;box-shadow:0 0 0 3px rgba(181,72,58,.10),0 6px 18px rgba(31,42,36,.06)}
.grid-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:.8rem}
.campo input,.campo select{height:38px}
.campo .opc{color:var(--suave);font-weight:600;font-size:.8rem}
.tabla-guia td,.tabla-guia th{padding:.5rem .7rem}
.demo-fila{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.medida{font-size:.78rem;color:var(--suave);font-weight:700}
.antes-despues{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:780px){.antes-despues{grid-template-columns:1fr}}
.rotulo{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:.1rem .5rem;margin-bottom:.4rem}
.r-antes{background:#ece9e1;color:#4a4a44}.r-ahora{background:var(--verde);color:#fff}
.dato-inc{background:#fdf0d2;border:1px dashed #c9922e;color:#7a5410}

    }).join('') + '</div>';
  }
  return cab(S.rol === 'vet' ? 'Mi día' : 'Pantallas del veterinario', S.rol === 'vet' ? '' : 'Prueba también «Ver como: Veterinario» arriba para ver el menú que le corresponde.', '') +
    cambia(['Tablas de agenda, atenciones y recetas, todas parecidas entre sí.', 'No se ve qué falta de cada atención (receta, cobro).'], ['<b>Inicio:</b> una tarjeta con el <i>siguiente paciente</i> y el botón principal «Iniciar atención».', '<b>Agenda:</b> línea de tiempo del día con los estados (por atender, atendido, emergencia).', '<b>Atenciones:</b> tarjeta con una barra de pasos <i>Cita → Atención → Receta → Cobro</i> para ver qué sigue.', '<b>Recetas:</b> tarjeta con aspecto de receta: medicamentos, dosis y botón de imprimir.'], TF) +
    '<div class="pestanas">' + tabs.map(function (x) { return '<button class="' + (t === x[0] ? 'on' : '') + '" data-a="vtab" data-t="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div>' + cuerpo;
}
function lineaAgenda() {
  return '<div class="linea-t">' + AGENDA.map(function (a) {
    var cl = a.e === 'at' ? '' : (a.e === 'eme' ? 'eme' : 'pend');
    return '<div class="it ' + cl + '"><div class="tarjeta" style="flex-direction:row;align-items:center;gap:.9rem;flex-wrap:wrap"><span class="etq e-gris" style="font-size:.9rem;height:28px">' + a.h + '</span>' + fotoMascota(MASCOTAS.filter(function (x) { return x.n === a.m; })[0], 'sm') + '<div style="flex:1;min-width:180px"><b>' + a.m + ' · ' + a.s + '</b>' + (a.e === 'eme' ? ' <span class="etq e-rojo">Emergencia</span>' : '') + '<div class="mut" style="font-size:.88rem">' + a.d + '</div></div><span class="etq ' + (a.e === 'at' ? 'e-solido' : 'e-mostaza') + '">' + (a.e === 'at' ? 'Atendido' : 'Por atender') + '</span></div></div>';
  }).join('') + '</div>';
}

/* ------------------------------- 14. Resumen ------------------------------- */
function vResumen() {
  var f = [
    ['Botones y menú', 'Escala única de tamaños y tipografía', 'Front', '—'], ['Clientes', 'Tarjetas con mascotas y ficha lateral', 'Front', '—'], ['Mascotas', 'Tarjetas con foto y filtros por tipo', 'Front', '—'],
    ['Emergencia', 'Registro rápido con datos mínimos', 'Front + <b>backend</b> (cliente provisional o DNI diferido)', '<b>Sí</b>'], ['Servicios', 'Tarjetas por tipo con precio destacado', 'Front', '—'],
    ['Diagnósticos', 'Lista por letra, uso y bloqueo con motivo', 'Front (el conteo se calcula con las atenciones)', '—'], ['Inventario', 'Se quita la nota final y el icono i; chips de categoría', 'Front', '—'],
    ['Categorías', 'Tarjetas con icono y cantidad de artículos', 'Front (fotos serían una columna nueva)', 'Solo si hay fotos'], ['Veterinarios / Administradores', 'Chips y botones alineados; fotos opcionales', 'Front; fotos: <b>SQL + Java</b> (2 tablas)', '<b>Sí</b> (fotos)'],
    ['Cuentas', 'Pestañas por rol y etiquetas de color', 'Front', '—'], ['Boletas', 'Anular como icono con confirmación', 'Front', '—'], ['Historial clínico', 'Un solo flujo con tarjetas y línea de tiempo', 'Front', '—'], ['Veterinario', 'Inicio, agenda, atenciones y recetas rediseñadas', 'Front', '—']
  ];
  return cab('Resumen de la propuesta', 'Qué se puede hacer solo en el front y qué toca el backend o necesita al JP.', '') +
    '<div class="tabla-wrap"><table><thead><tr><th>Pantalla</th><th>Cambio</th><th>Dónde</th><th>¿Aprobación del JP?</th></tr></thead><tbody>' + f.map(function (x) { return '<tr><td><b>' + x[0] + '</b></td><td>' + x[1] + '</td><td>' + x[2] + '</td><td>' + x[3] + '</td></tr>'; }).join('') + '</tbody></table></div>' +
    '<div class="resumen-req" style="margin-top:1.2rem"><div class="card"><h5>Criterio para las notas al pie</h5><ul><li>Una nota explica algo que la pantalla <b>no puede mostrar</b> (una regla que bloquea una acción): va como <i>tooltip</i> en el candado.</li><li>Las instrucciones de uso («cambie el stock con − y +») se quitan.</li><li>Las explicaciones de otra pantalla («los horarios se asignan desde…») van en esa pantalla.</li></ul></div>' +
    '<div class="card"><h5>Criterio para los colores</h5><ul><li>El <b>fondo</b> (verde de las filas alternas, crema) es solo estético y no indica nada.</li><li>Lo que sí significa algo (stock bajo, anulada, emergencia) se muestra con una <b>etiqueta con texto</b>, nunca solo con el color de fondo de una fila.</li></ul></div>' +
    '<div class="card"><h5>Lo que ayudaría para afinar</h5><ul><li>Capturas de las pantallas del veterinario (inicio, agenda, atenciones, recetas) y de Administradores, Horarios y Citas.</li><li>Fotos de ejemplo de los veterinarios y administradores, si se quiere probar la foto.</li><li>Confirmar con el JP el caso de emergencia con datos mínimos.</li></ul></div></div>';
}

var VIEWS = { guia: vGuia, clientes: vClientes, mascotas: vMascotas, emergencia: vEmergencia, servicios: vServicios, diagnosticos: vDiag, inventario: vInventario, categorias: vCategorias, personal: vPersonal, cuentas: vCuentas, boletas: vBoletas, historial: vHistorial, vet: vVet, resumen: vResumen };
function render() { barra(); pestanas(); $('#app').innerHTML = VIEWS[S.vista](); }

function modal(titulo, texto, ok) {
  $('#modal').innerHTML = '<div class="ov" data-a="cerrar"><div class="md" role="dialog" aria-modal="true" aria-label="' + esc(titulo) + '"><h4>' + esc(titulo) + '</h4><p>' + texto + '</p><div class="f"><button class="btn btn-s" data-a="cerrar-m">Cancelar</button><button class="btn btn-ds" data-a="ok-m" data-t="' + esc(ok) + '">' + ic('ban') + 'Confirmar</button></div></div></div>';
}
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-a]'); if (!el) return; var a = el.dataset.a;
  if (a === 'cerrar' && e.target !== el) return;
  if (a === 'vista') { S.vista = el.dataset.v; render(); window.scrollTo(0, 0); }
  else if (a === 'toast') { toast(el.dataset.t); }
  else if (a === 'eliminar') { modal('¿Eliminar este registro?', 'Dejará de aparecer en los listados. Si otra parte del sistema lo usa, el backend lo rechazará y se mostrará el motivo.', 'Registro eliminado (simulado)'); }
  else if (a === 'anular') { modal('¿Anular la boleta ' + el.dataset.b + '?', 'La boleta quedará marcada como <b>anulada</b> y no se podrá modificar. Su número no se vuelve a usar.', 'Boleta ' + el.dataset.b + ' anulada (simulado)'); }
  else if (a === 'cerrar' || a === 'cerrar-m') { $('#modal').innerHTML = ''; }
  else if (a === 'ok-m') { $('#modal').innerHTML = ''; toast(el.dataset.t); }
  else if (a === 'selcli') { S.cli.sel = +el.dataset.id; render(); }
  else if (a === 'modo-cli') { S.cli.modo = el.dataset.m; render(); }
  else if (a === 'modo-mas') { S.mas.modo = el.dataset.m; render(); }
  else if (a === 'f-mas') { S.mas.f = el.dataset.f; render(); }
  else if (a === 'f-srv') { S.srv.f = el.dataset.f; render(); }
  else if (a === 'f-inv') { S.inv.f = el.dataset.f; render(); }
  else if (a === 'f-inv-ir') { S.inv.f = el.dataset.f; S.vista = 'inventario'; render(); window.scrollTo(0, 0); }
  else if (a === 'f-cue') { S.cue.f = el.dataset.f; render(); }
  else if (a === 'eme') { S.eme.on = !S.eme.on; render(); }
  else if (a === 'fotos') { S.per.fotos = !S.per.fotos; render(); }
  else if (a === 'hist') { S.hist.sel = el.dataset.n; render(); }
  else if (a === 'vtab') { S.vv.tab = el.dataset.t; render(); }
  else if (a === 'filtrar' || a === 'limpiar') {
    var campo = a === 'limpiar' ? '' : null;
    var m = { cliente: 'q-cli', diagnosticos: 'q-dg', inventario: 'q-inv' }; var id = m[S.vista];
    if (S.vista === 'clientes') S.cli.q = campo === '' ? '' : $('#q-cli').value;
    if (S.vista === 'diagnosticos') S.dg.q = campo === '' ? '' : $('#q-dg').value;
    if (S.vista === 'inventario') { S.inv.q = campo === '' ? '' : $('#q-inv').value; S.inv.bajo = campo === '' ? false : $('#bajo').checked; if (campo === '') S.inv.f = 'Todas'; }
    render();
  }
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') $('#modal').innerHTML = ''; if (e.key === 'Enter' && e.target.matches('.filtros input[type=search]')) { var b = e.target.parentNode.querySelector('[data-a=filtrar]'); if (b) b.click(); } });
$('#rol').addEventListener('change', function (e) { S.rol = e.target.value; if (S.rol === 'vet') S.vista = 'vet'; render(); });
render();
</script>
</body>
</html>
